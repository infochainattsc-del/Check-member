<!DOCTYPE html>
<html lang="th" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ตรวจสอบรายชื่อหน่วยสรรหา ประจำปี 2570</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }
    body { 
      font-family: 'Prompt', sans-serif; 
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center pb-12 w-full overflow-x-hidden">

  <!-- Header Banner -->
  <header class="w-full bg-gradient-to-r from-indigo-900 via-indigo-800 to-indigo-900 text-white py-6 px-4 shadow-lg text-center">
    <div class="w-full max-w-lg mx-auto">
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight break-words">ระบบตรวจสอบรายชื่อหน่วยสรรหา</h1>
      <p class="text-indigo-200 text-xs sm:text-sm mt-1 font-light">คณะกรรมการดำเนินการ ประจำปี 2570</p>
      <p class="text-indigo-200 text-xs sm:text-sm mt-1 font-light">ในวันที่ 29 พฤศจิกายน พ.ศ. 2569 เริ่มเวลา 08.00 - 11.00 น.</p>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-lg px-3 sm:px-4 -mt-3">
    
    <!-- Search Box Card -->
    <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border border-slate-200/80 w-full">
      <label for="keyword" class="block text-xs sm:text-sm font-medium text-slate-700 mb-2">
        กรอกข้อมูลเพื่อค้นหา
      </label>
      
      <div class="flex flex-col sm:flex-row gap-2 w-full">
        <div class="relative w-full">
          <input 
            type="text" 
            id="keyword" 
            placeholder="เลขทะเบียน หรือ ชื่อ - นามสกุล" 
            class="w-full pl-3 pr-3 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent text-sm sm:text-base text-slate-800 transition shadow-sm"
            onkeypress="if(event.key === 'Enter') search()"
          >
        </div>
        
        <button 
          onclick="search()" 
          class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium px-5 py-2.5 rounded-xl transition duration-150 shadow-md flex items-center justify-center gap-2 cursor-pointer w-full sm:w-auto flex-shrink-0 text-sm"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <span>ค้นหา</span>
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="hidden text-center my-6">
      <div class="inline-block animate-spin rounded-full h-7 w-7 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="text-slate-500 text-xs mt-2">กำลังค้นหาข้อมูล...</p>
    </div>

    <!-- Results Display Container -->
    <div id="results" class="mt-4 space-y-3 w-full"></div>

  </main>

  <script>
    // ⚠️ นำ Web App URL ที่ได้จาก Google Apps Script มาใส่ตรงนี้
    const API_URL = "https://script.google.com/macros/s/YOUR_WEB_APP_ID/exec";

    async function search() {
      const keyword = document.getElementById('keyword').value.trim();
      const container = document.getElementById('results');
      const loading = document.getElementById('loading');

      if (!keyword) {
        container.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 text-amber-800 text-center p-3.5 rounded-xl text-xs sm:text-sm animate-fade-in w-full">
            กรุณากรอกเลขทะเบียน หรือ ชื่อ-นามสกุล ก่อนกดค้นหา
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      loading.classList.remove('hidden');

      try {
        const response = await fetch(`${API_URL}?q=${encodeURIComponent(keyword)}`);
        const result = await response.json();

        loading.classList.add('hidden');

        if (result.status === "success" && result.data && result.data.length > 0) {
          displayResults(result.data);
        } else {
          container.innerHTML = `
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center animate-fade-in w-full">
              <svg class="w-10 h-10 text-slate-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <p class="text-slate-600 font-medium text-sm">ไม่พบผลลัพธ์ข้อมูลที่ค้นหา</p>
              <p class="text-slate-400 text-xs mt-1">โปรดตรวจสอบตัวสะกด หรือเลขทะเบียนให้อีกครั้ง</p>
            </div>
          `;
        }
      } catch (error) {
        loading.classList.add('hidden');
        container.innerHTML = `
          <div class="bg-red-50 border border-red-200 text-red-700 p-3.5 rounded-xl text-center text-xs sm:text-sm animate-fade-in w-full">
            เกิดข้อผิดพลาดในการดึงข้อมูล: โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต
          </div>
        `;
      }
    }

    function displayResults(data) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200/80 animate-fade-in w-full box-border overflow-hidden';

        const hasPaper = item.paper && item.paper.trim() !== '' && item.paper !== '-' && item.paper !== 'ไม่มี';
        
        div.innerHTML = `
          <div class="border-b border-slate-100 pb-2.5 mb-3 flex flex-col items-start gap-1">
            <span class="inline-block bg-indigo-50 text-indigo-700 text-[11px] font-semibold px-2 py-0.5 rounded-md">
              ทะเบียน : ${item.idname || '-'}
            </span>
            <h2 class="text-lg sm:text-xl font-bold text-slate-800 break-words w-full">${item.name || '-'}</h2>
          </div>

          <div class="mb-3">
            <span class="text-[11px] text-slate-400 block font-light">สังกัด / หน่วยงาน</span>
            <span class="text-sm sm:text-base font-medium text-slate-700 break-words block">${item.unit || '-'}</span>
          </div>

          <div class="grid grid-cols-2 gap-2 mb-3 w-full">
            <div class="bg-indigo-50/70 border border-indigo-100 p-2.5 rounded-xl text-center">
              <span class="text-[11px] text-indigo-600 font-medium block">หน่วยสรรหาที่</span>
              <span class="text-xl sm:text-2xl font-extrabold text-indigo-900">${item.unitNo || '-'}</span>
            </div>
            <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl text-center">
              <span class="text-[11px] text-slate-500 font-medium block">ลำดับที่</span>
              <span class="text-xl sm:text-2xl font-extrabold text-slate-800">${item.seq || '-'}</span>
            </div>
          </div>

          <div class="p-2.5 rounded-xl text-xs flex items-center justify-between ${hasPaper ? 'bg-amber-50 border border-amber-200 text-amber-900' : 'bg-slate-50 border border-slate-100 text-slate-600'}">
            <span class="font-medium">รับเอกสารเพิ่มเติม:</span>
            <span class="font-bold ${hasPaper ? 'text-amber-700' : 'text-slate-500'} break-words max-w-[60%] text-right">${item.paper || '-'}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>

</body>
</html>
